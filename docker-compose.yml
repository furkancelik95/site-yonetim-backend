# Yerel geliştirme. Kullanım: `cp env.example .env` → `docker compose up --build`
# Üretim yapılandırması DEĞİLDİR.
services:
  api:
    build: .
    env_file: .env
    environment:
      # Kapsayıcıya dışarıdan "localhost:8000" ile gelinir.
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
